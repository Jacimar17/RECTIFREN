services:
  - type: web
    name: rectifren-api
    runtime: node
    rootDir: .
    buildCommand: npm ci --prefix backend/api
    startCommand: npm start --prefix backend/api
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FAMILIAS_CATALOGO_PERSISTIDO_HABILITADAS
        value: "true"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
